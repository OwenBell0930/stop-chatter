<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1B2340"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0B1020" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-coral" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#FF6B4A"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#19A974"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#F7F5EF"/>
  <text x="64" y="54" fill="#171C2C" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="800" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">You asked for a dish. The agent shipped its correction history.</text><text x="64" y="90" fill="#687086" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">One correction can produce two very different artifacts</text><rect x="40" y="122" width="560" height="548" rx="24" fill="#FFFFFF" opacity="1" stroke="#F1BEB3" stroke-width="1" filter="url(#shadow)"/><rect x="680" y="122" width="560" height="548" rx="24" fill="#FFFFFF" opacity="1" stroke="#A9DFC9" stroke-width="1" filter="url(#shadow)"/><rect x="64" y="144" width="156" height="34" rx="17" fill="#FFF0EC" opacity="1"/><text x="142" y="162" fill="#FF6B4A" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="800" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">TYPICAL AGENT</text><rect x="704" y="144" width="156" height="34" rx="17" fill="#EAF8F2" opacity="1"/><text x="782" y="162" fill="#19A974" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0.8">STOP CHATTER</text><rect x="64" y="194" width="512" height="64" rx="12" fill="#FFF0EC" opacity="1" stroke="#FF6B4A" stroke-width="1"/><circle cx="92" cy="226" r="15" fill="#FF6B4A"/><text x="92" y="227" fill="#FFFFFF" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">1</text><text x="120" y="216" fill="#171C2C" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="750" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">User asks: tomato &amp; egg</text><text x="120" y="238" fill="#687086" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">The target starts clear</text><rect x="64" y="266" width="512" height="64" rx="12" fill="#FFF0EC" opacity="1" stroke="#FF6B4A" stroke-width="1"/><circle cx="92" cy="298" r="15" fill="#FF6B4A"/><text x="92" y="299" fill="#FFFFFF" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">2</text><text x="120" y="288" fill="#171C2C" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="750" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Agent adds: Dongpo pork</text><text x="120" y="310" fill="#687086" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">“Helpful” scope expansion begins</text><rect x="64" y="338" width="512" height="64" rx="12" fill="#FFF0EC" opacity="1" stroke="#FF6B4A" stroke-width="1"/><circle cx="92" cy="370" r="15" fill="#FF6B4A"/><text x="92" y="371" fill="#FFFFFF" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">3</text><text x="120" y="360" fill="#171C2C" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="750" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">User says: remove it</text><text x="120" y="382" fill="#687086" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">The old idea stays inside the working target</text><rect x="64" y="410" width="512" height="64" rx="12" fill="#FFF0EC" opacity="1" stroke="#FF6B4A" stroke-width="1"/><circle cx="92" cy="442" r="15" fill="#FF6B4A"/><text x="92" y="443" fill="#FFFFFF" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">4</text><text x="120" y="432" fill="#171C2C" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="750" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">PR: “Tomato &amp; egg (no pork)”</text><text x="120" y="454" fill="#687086" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Titles, comments, and tests repeat the mistake</text><rect x="64" y="482" width="512" height="64" rx="12" fill="#FFF0EC" opacity="1" stroke="#FF6B4A" stroke-width="1"/><circle cx="92" cy="514" r="15" fill="#FF6B4A"/><text x="92" y="515" fill="#FFFFFF" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">5</text><text x="120" y="504" fill="#171C2C" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="750" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Long task: pork elbow returns</text><text x="120" y="526" fill="#687086" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">The rejected idea comes back under a nearby name</text><rect x="64" y="568" width="512" height="74" rx="14" fill="#0B1020" opacity="1"/><text x="88" y="592" fill="#AAB3CB" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="800" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="1">RESULT</text><text x="88" y="618" fill="#FFFFFF" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="750" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Extra scope + explanations + process residue</text><rect x="704" y="194" width="512" height="64" rx="12" fill="#EAF8F2" opacity="1" stroke="#19A974" stroke-width="1"/><circle cx="732" cy="226" r="15" fill="#19A974"/><text x="732" y="227" fill="#FFFFFF" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">1</text><text x="760" y="216" fill="#171C2C" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="750" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Recompile the positive target</text><text x="760" y="238" fill="#687086" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">What is wanted now: tomato &amp; egg</text><rect x="704" y="272" width="512" height="64" rx="12" fill="#EAF8F2" opacity="1" stroke="#19A974" stroke-width="1"/><circle cx="732" cy="304" r="15" fill="#19A974"/><text x="732" y="305" fill="#FFFFFF" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">2</text><text x="760" y="294" fill="#171C2C" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="750" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Prune the old dependency cone</text><text x="760" y="316" fill="#687086" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Code, config, tests, comments, UI, PR, memory</text><rect x="704" y="350" width="512" height="64" rx="12" fill="#EAF8F2" opacity="1" stroke="#19A974" stroke-width="1"/><circle cx="732" cy="382" r="15" fill="#19A974"/><text x="732" y="383" fill="#FFFFFF" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">3</text><text x="760" y="372" fill="#171C2C" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="750" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Trace changes to active needs</text><text x="760" y="394" fill="#687086" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Delete anything without independent support</text><rect x="704" y="428" width="512" height="64" rx="12" fill="#EAF8F2" opacity="1" stroke="#19A974" stroke-width="1"/><circle cx="732" cy="460" r="15" fill="#19A974"/><text x="732" y="461" fill="#FFFFFF" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">4</text><text x="760" y="450" fill="#171C2C" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="750" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Ship the current state</text><text x="760" y="472" fill="#687086" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">No correction history. No “without X” edition</text><rect x="704" y="520" width="512" height="122" rx="16" fill="#0B1020" opacity="1"/><text x="730" y="548" fill="#AAB3CB" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="800" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="1">FINAL ARTIFACT</text><text x="730" y="590" fill="#FFFFFF" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="850" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Tomato &amp; egg stir-fry</text><text x="730" y="620" fill="#A9DFC9" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="650" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Only the current requested result</text><circle cx="1170" cy="581" r="22" fill="#19A974"/><path d="M1159 581l8 8 15-18" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640" cy="386" r="30" fill="#FFFFFF" stroke="#DDE1EA" filter="url(#shadow)"/><path d="M628 386h23m-8-9 9 9-9 9" fill="none" stroke="#19A974" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
