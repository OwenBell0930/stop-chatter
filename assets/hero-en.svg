    <text x="164" y="96" fill="#FFFFFF" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="3">STOP CHATTER</text><text x="72" y="198" fill="#CBD2E4" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Make LLMs output only the result you asked for</text><text x="72" y="268" fill="#FF6B4A" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="40" font-weight="850" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">No extra explanation.</text><text x="72" y="338" fill="#FF6B4A" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="44" font-weight="850" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">No process residue.</text><rect x="72" y="402" width="126" height="42" rx="21" fill="#FFFFFF" opacity="0.08" stroke="#FFFFFF" stroke-width="1"/><text x="135" y="424" fill="#FFFFFF" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="1">CURSOR</text><rect x="214" y="402" width="118" height="42" rx="21" fill="#FFFFFF" opacity="0.08" stroke="#FFFFFF" stroke-width="1"/><text x="273" y="424" fill="#FFFFFF" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="1">CODEX</text><rect x="348" y="402" width="174" height="42" rx="21" fill="#FFFFFF" opacity="0.